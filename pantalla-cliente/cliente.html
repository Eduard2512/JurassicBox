<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantalla cliente · Movie Time</title><link rel="stylesheet" href="cliente.css"></head><body>
<div class="stage">
  <div class="top">
    <span class="logo"><img src="logo-movietime.svg" alt="Movie Time"></span>
    <div class="meta"><span class="chip"><i></i>Tu pedido</span><span class="clock" id="clock"></span></div>
  </div>
  <div class="main">
    <section class="col"><div class="sec-title">Detalle</div><div class="list" id="list"></div></section>
    <section class="col"><div class="sec-title">Tu selección</div><div class="show n1" id="show"></div></section>
  </div>
  <div class="bar"><div class="cnt" id="cnt"></div><div class="tt"><span>TOTAL</span><strong id="tot"></strong></div></div>
</div>
<div class="thanks hide" id="thanks">
  <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>¡Gracias por tu compra!</h1><p>Disfruta la función 🍿</p>
  <span class="logo"><img src="logo-movietime.svg" alt=""></span>
</div>
<div class="ads hide" id="ads"><div class="prog" id="prog"></div></div>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ?mini=1 -> vista en miniatura dentro del panel del colaborador (sin animaciones pesadas ni pantalla completa)
const MINI=new URLSearchParams(location.search).has('mini');
if(MINI)document.documentElement.classList.add('mini');
else document.addEventListener('dblclick',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
const tick=()=>{$('clock').textContent=new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false})};tick();setInterval(tick,10000);

/* ---------- Fotos de producto (con ilustración si no hay foto) ---------- */
function photo(i){
  const ph=document.createElement('div');ph.className='ph';
  const im=new Image();im.alt='';im.decoding='async';im.src='productos/'+(i.img||i.code)+'.webp';
  im.onerror=()=>{ph.innerHTML='<div class="nophoto"><img src="logo-movietime.svg" alt=""></div>'};ph.appendChild(im);return ph}

/* ---------- Detalle + vitrina ---------- */
let prevQty={},lastKey='',showEls={};
function render(s){
  $('thanks').classList.toggle('hide',s.status!=='gracias');
  const items=s.items;
  // detalle
  let changed=null;items.forEach(i=>{const k=i.code+'|'+i.price;if((prevQty[k]||0)!==i.qty)changed=k});
  $('list').innerHTML=items.map(i=>{const k=i.code+'|'+i.price,isNew=k===changed;
    return `<div class="line ${isNew?'new':'nan'}"><div class="qty">${i.qty}</div><div><div class="nm">${esc(i.name)}</div>${i.desc?`<div class="ds">${esc(i.desc)}</div>`:''}</div><div class="pr">${PC.money(PC.lineTotal(i))}${i.qty>1?`<small>${i.qty} × ${PC.money(i.price)}</small>`:''}</div></div>`}).join('');
  const L=$('list');L.classList.remove('compact');if(L.scrollHeight>L.clientHeight+2)L.classList.add('compact');
  L.scrollTop=L.scrollHeight;L.classList.toggle('scrolled',L.scrollTop>2);
  prevQty={};items.forEach(i=>prevQty[i.code+'|'+i.price]=i.qty);
  const n=items.reduce((a,i)=>a+i.qty,0);
  $('cnt').innerHTML=`<b>${n}</b> ${n===1?'producto':'productos'}`;
  const t=PC.money(PC.total());if($('tot').textContent!==t){$('tot').textContent=t;$('tot').classList.remove('bump');void $('tot').offsetWidth;$('tot').classList.add('bump')}
  // vitrina: productos distintos, el último agregado primero
  const seen=new Set(),uniq=[];for(const i of [...items].reverse()){if(!seen.has(i.code)){seen.add(i.code);uniq.push(i)}}
  const shown=uniq.slice(0,6),extra=uniq.length-shown.length;
  const key=shown.map(i=>i.code).join(',')+'|'+extra;
  const qtyOf=c=>items.filter(i=>i.code===c).reduce((a,i)=>a+i.qty,0);
  const show=$('show');
  if(key!==lastKey){
    const old=new Set(Object.keys(showEls));lastKey=key;showEls={};show.innerHTML='';
    show.className='show n'+Math.max(1,shown.length);
    shown.forEach(i=>{const t=document.createElement('div');t.className='tile'+(old.has(i.code)?' nan':'');
      t.appendChild(photo(i));const cap=document.createElement('div');cap.className='cap';cap.innerHTML=`<span>${esc(i.name)}</span><b></b>`;t.appendChild(cap);
      showEls[i.code]=cap.querySelector('b');show.appendChild(t)});
    if(extra>0){const m=document.createElement('div');m.className='more';m.textContent='+'+extra+' más';show.appendChild(m)}
  }
  shown.forEach(i=>{const q=qtyOf(i.code);showEls[i.code].textContent='×'+q;showEls[i.code].classList.toggle('hide',q<2)});
  checkAds();
}

/* ---------- Publicidad a pantalla completa ---------- */
// La pantalla real manda; la miniatura del panel (?mini=1) solo la sigue. El panel del colaborador controla por el canal 'pc_ads'.
let nodes=[],cur=0,paused=false,adsSig='',timer=0,running=false,lastMaster=0;
const adCh='BroadcastChannel' in window?new BroadcastChannel('pc_ads'):null;
const masterAlive=()=>Date.now()-lastMaster<6000;
const comboLists=s=>({
  sal:s.catalog.filter(p=>/^combos salada/i.test(p.cat||'')&&!/hot dog/i.test(p.name)).slice(0,4),   // combos salados (sin las versiones con hot dog)
  dul:s.catalog.filter(p=>/^combos dulce/i.test(p.cat||'')).slice(0,4)});
function publishAd(){if(MINI||!adCh)return;adCh.postMessage({t:'state',idx:cur,paused,total:nodes.length,running})}
function buildSlides(){
  const s=PC.state,root=$('ads');[...root.querySelectorAll('.sl')].forEach(e=>e.remove());nodes=[];
  const {sal,dul}=comboLists(s);
  if(sal.length||dul.length){const d=document.createElement('div');d.className='sl combos';
    d.innerHTML=`<div class="ch"><span class="logo"><img src="logo-movietime.svg" alt=""></span><h2>Combos Movie Time</h2></div>`;
    [['Combos salados',sal],['Combos dulces',dul]].forEach(([label,list])=>{if(!list.length)return;
      const row=document.createElement('div');row.className='crow';row.innerHTML=`<div class="rl">${label}</div><div class="cg"></div>`;
      list.forEach(p=>{const cc=document.createElement('div');cc.className='cc';cc.appendChild(photo(p));
        cc.insertAdjacentHTML('beforeend',`<b>${esc(p.name)}</b><em>${esc(p.desc||'')}</em><div class="pp">${PC.money(p.price)}</div>`);row.querySelector('.cg').appendChild(cc)});
      d.appendChild(row)});
    root.insertBefore(d,$('prog'));nodes.push(d)}
  s.slides.filter(x=>x.image).forEach(x=>{const d=document.createElement('div');d.className='sl';
    d.innerHTML=`<img src="${esc(x.image)}" alt="" decoding="async">`;
    d.firstChild.onerror=()=>{d.remove();nodes=nodes.filter(n=>n!==d);if(cur>=nodes.length)cur=0;publishAd()};
    if(x.title||x.sub)d.insertAdjacentHTML('beforeend',`<div style="position:absolute;left:0;right:0;bottom:8%;text-align:center;text-shadow:0 .2rem 1rem #000"><div style="font-size:5rem;font-weight:800">${esc(x.title||'')}</div><div style="font-size:2.4rem">${esc(x.sub||'')}</div></div>`);
    root.insertBefore(d,$('prog'));nodes.push(d)});
}
function showSlide(i,silent){
  if(!nodes.length)return;
  nodes.forEach(n=>n.classList.remove('on'));cur=((i%nodes.length)+nodes.length)%nodes.length;
  const n=nodes[cur];void n.offsetWidth;n.classList.add('on');
  const root=$('ads'),p=$('prog');root.style.setProperty('--dur',PC.state.slideSeconds+'s');
  p.classList.remove('run');void p.offsetWidth;p.classList.add('run');     // si esta en pausa, la barra queda congelada por CSS
  if(!silent)publishAd();
}
function schedule(){
  clearTimeout(timer);timer=0;
  if(!running||paused||!nodes.length)return;
  if(MINI&&masterAlive())return;                              // la miniatura sigue a la pantalla real
  timer=setTimeout(()=>{showSlide(cur+1);schedule()},PC.state.slideSeconds*1000);
}
function setPaused(v){
  paused=!!v;$('ads').classList.toggle('paused',paused);
  if(!paused&&running){const p=$('prog');p.classList.remove('run');void p.offsetWidth;p.classList.add('run')}
  schedule();publishAd();
}
function checkAds(){
  const s=PC.state,on=s.status==='idle',root=$('ads'),cl=comboLists(s);
  root.classList.toggle('hide',!on);
  if(on){
    const sig=JSON.stringify([s.slides,cl.sal.concat(cl.dul).map(p=>p.code+p.price+p.name),s.slideSeconds]);
    if(sig!==adsSig||!nodes.length){adsSig=sig;buildSlides();if(cur>=nodes.length)cur=0}
    if(!running){running=true;showSlide(paused?cur:0)}   // pausada: vuelve a la misma imagen; si no, empieza de nuevo
    schedule();
  }else if(running){running=false;clearTimeout(timer);timer=0;publishAd()}
}
function doCmd(m){
  if(!running&&m.cmd!=='play'&&m.cmd!=='pause'&&m.cmd!=='toggle')return;
  if(m.cmd==='toggle')setPaused(!paused);
  else if(m.cmd==='pause')setPaused(true);
  else if(m.cmd==='play')setPaused(false);
  else if(m.cmd==='next'){showSlide(cur+1);schedule()}
  else if(m.cmd==='prev'){showSlide(cur-1);schedule()}
  else if(m.cmd==='goto'&&nodes.length){showSlide(+m.idx||0);setPaused(true)}    // elegir una imagen la deja fija
}
if(adCh)adCh.onmessage=e=>{const m=e.data||{};
  if(MINI){
    if(m.t!=='state')return;
    lastMaster=Date.now();
    if(m.paused!==paused){paused=m.paused;$('ads').classList.toggle('paused',paused)}
    if(running&&nodes.length&&m.idx!==cur)showSlide(m.idx,true);
    schedule();
  }else if(m.t==='hello')publishAd();
  else if(m.t==='cmd')doCmd(m)};
if(!MINI){
  setInterval(publishAd,3000);                                  // el panel y la miniatura se mantienen sincronizados
  document.addEventListener('keydown',e=>{                       // teclado en la pantalla del cliente: espacio = pausa, flechas = cambiar
    if(e.code==='Space'){e.preventDefault();doCmd({cmd:'toggle'})}
    else if(e.code==='ArrowRight')doCmd({cmd:'next'});else if(e.code==='ArrowLeft')doCmd({cmd:'prev'})});
}else if(adCh)adCh.postMessage({t:'hello'});
PC.subscribe(render);
</script></body></html>
